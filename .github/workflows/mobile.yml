name: Mobile quality
on:
  push:
    paths: ['mobile/**', 'app/Http/Controllers/Mobile/**', 'database/migrations/*mobile*', 'routes/api.php', 'tests/Feature/MobileSyncTest.php', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'app/Http/Controllers/Mobile/**', 'database/migrations/*mobile*', 'routes/api.php', 'tests/Feature/MobileSyncTest.php', '.github/workflows/mobile.yml']
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
  sync-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/pest tests/Feature/MobileSyncTest.php --configuration mobile/backend-tests.xml
